          - heading [level=2] [ref=e533]:
            - strong [ref=e534]: IRCTC Next Generation Ticket Booking
          - paragraph [ref=e535]:
            - text: Established in 1999, Indian Railway Catering and Tourism Corporation (IRCTC) is the official online ticketing arm of Indian Railways, offering railway ticketing, catering, and tourism services to passengers across India. Its online reservation platform,
            - link "IRCTC next generation" [ref=e536] [cursor=pointer]:
              - /url: https://www.ixigo.com/irctc-next-generation-ticket-booking-story-1164367
            - text: e-Ticketing System, allows travellers to book train tickets online conveniently. To improve security and streamline the reservation process, passengers are advised to link Aadhaar to their IRCTC account. Aadhaar linking enables smoother authentication during train bookings, helping ensure a more secure and transparent ticketing system.
          - paragraph [ref=e539]: The total number of trains running today is 18,909, as last updated on 2026-10-29
        - generic [ref=e540]:
          - heading "IRCTC Login — Access Your Account on ixigo" [level=2] [ref=e541]
          - paragraph [ref=e542]: With ixigo, you can register & navigate the next-generation IRCTC login process, reset your password and more. You can also recover a deactivated IRCTC ID, update profile details, and easily manage your bookings.
          - generic [ref=e543]:
            - heading "How to Log in to Your IRCTC Account" [level=3] [ref=e544]
